[package]
name = "codex-provider-session-sync"
version = "0.2.0"
description = "Codex Desktop provider session aggregator"
authors = ["Alllynnn"]
edition = "2021"

[lib]
name = "codex_provider_session_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
opener = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.1", features = ["tray-icon", "image-ico"] }
uuid = { version = "1.11", features = ["v5", "serde"] }
walkdir = "2.5"
winreg = "0.55"
